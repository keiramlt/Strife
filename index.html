<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2EE Chat</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #bb86fc;
            --accent-hover: #9c68d9;
            --msg-self: #388e3c;
            --msg-other: #333333;
            --danger: #cf6679;
            --warn: #f0a020;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Login Screen --- */
        #login-screen {
            background-color: var(--panel-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            transition: opacity 0.4s ease;
        }

        h1 { text-align: center; margin-bottom: 1.5rem; color: var(--accent); }

        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-muted); }
        .input-group input {
            width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #333;
            background-color: #2a2a2a; color: white; font-size: 1rem; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }

        button {
            width: 100%; padding: 0.9rem; border: none; border-radius: 6px;
            background-color: var(--accent); color: white; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: default; }

        /* --- Chat Screen --- */
        #chat-screen {
            display: none; width: 100%; height: 100%; flex-direction: column;
            max-width: 900px; background-color: var(--panel-bg);
        }

        #chat-header {
            padding: 1.2rem; background-color: #1a1a1a; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
        }
        #chat-header h2 { font-size: 1.2rem; margin: 0; color: var(--accent); }

        #chat-messages {
            flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;
        }

        .message { max-width: 75%; padding: 0.8rem 1.2rem; border-radius: 15px; position: relative; line-height: 1.4; word-wrap: break-word;}
        .msg-self { background-color: var(--msg-self); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background-color: var(--msg-other); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-error { background-color: transparent; border: 1px solid var(--danger); color: var(--danger); }

        .msg-sender { font-size: 0.75rem; margin-bottom: 0.3rem; opacity: 0.8; font-weight: bold; }

        #chat-input-area {
            padding: 1rem; background-color: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 0.5rem;
        }
        #chat-input-area input {
            flex: 1; padding: 0.8rem; border-radius: 20px; border: 1px solid #333;
            background-color: #2a2a2a; color: white; outline: none;
        }
        #chat-input-area button { width: auto; padding: 0.8rem 1.5rem; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>E2EE Chat</h1>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" maxlength="32" placeholder="e.g. Keira" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="roomCode">Room Code</label>
            <input type="text" id="roomCode" placeholder="e.g. session-17625843" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="encKey">Encryption Key (Password)</label>
            <input type="password" id="encKey" placeholder="use a long, random passphrase">
        </div>
        <button id="joinBtn">Join Room</button>
    </div>

    <div id="chat-screen">
        <div id="chat-header">
            <h2 id="room-title">Room: ...</h2>
            <button id="leaveBtn" style="width: auto; padding: 0.5rem 1rem; background: transparent; border: 1px solid #cf6679; color: #cf6679;">Leave</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="messageInput" maxlength="4000" placeholder="Type an encrypted message..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // --- State ---
        const API = "https://kei.mt/chat/api.php";
        let cryptoKey;
        let currentUser;
        let currentRoom;
        let lastTime = 0;
        let pollInterval;
        const seen = new Set(); // anti-replay: authenticated (user|ts) tuples already shown
        
        // --- Crypto Utilities ---
        const enc = new TextEncoder();
        const dec = new TextDecoder();

        function b64ToBytes(b64) {
            const bin = atob(b64);
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        // Derive the AES key from the password + a RANDOM per-room salt fetched
        // from the server. 600,000 PBKDF2 iterations (OWASP 2023+ guidance).
        async function deriveKey(password, saltBytes) {
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: saltBytes, iterations: 600000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        // Bind room + sender + timestamp into the cipher as additional authenticated
        // data, so a forged username or tampered timestamp fails authentication.
        function buildAAD(room, user, ts) {
            return enc.encode(JSON.stringify({ r: room, u: user, t: ts }));
        }

        async function encryptMessage(text, user, ts) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv, additionalData: buildAAD(currentRoom, user, ts) },
                cryptoKey, enc.encode(text)
            );
            return { iv: Array.from(iv), ciphertext: Array.from(new Uint8Array(encrypted)) };
        }

        async function decryptMessage(ciphertextArray, ivArray, user, ts) {
            try {
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: new Uint8Array(ivArray), additionalData: buildAAD(currentRoom, user, ts) },
                    cryptoKey, new Uint8Array(ciphertextArray)
                );
                return dec.decode(decrypted);
            } catch (e) {
                return null; // wrong key OR forged sender/timestamp OR tampered ciphertext
            }
        }

        // --- UI & Event Listeners ---
        document.getElementById('joinBtn').addEventListener('click', async () => {
            const btn  = document.getElementById('joinBtn');
            const user = document.getElementById('username').value.trim();
            const room = document.getElementById('roomCode').value.trim();
            const key  = document.getElementById('encKey').value;

            if (!user || !room || !key) return alert("All fields are required.");
            if (user.length > 32) return alert("Username too long (max 32).");

            btn.disabled = true; btn.innerText = "Joining...";
            try {
                // Fetch the random per-room salt before deriving the key.
                const saltRes = await fetch(`${API}?room=${encodeURIComponent(room)}&action=salt`);
                if (!saltRes.ok) throw new Error("salt fetch failed");
                const { salt } = await saltRes.json();
                if (!salt) throw new Error("no salt");

                currentUser = user;
                currentRoom = room;
                cryptoKey = await deriveKey(key, b64ToBytes(salt));
            } catch (e) {
                btn.disabled = false; btn.innerText = "Join Room";
                return alert("Could not reach the server. Make sure it's running over HTTPS.");
            }

            document.getElementById('room-title').innerText = `Room: ${room}`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';

            startPolling();
        });

        document.getElementById('leaveBtn').addEventListener('click', () => {
            clearInterval(pollInterval);
            location.reload();
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // --- Chat Logic (PHP Polling) ---
        function startPolling() {
            appendSystemMessage("Connected. Messages are end-to-end encrypted in your browser.");
            pollInterval = setInterval(fetchMessages, 2000);
            fetchMessages();
        }

        async function fetchMessages() {
            try {
                const res = await fetch(`${API}?room=${encodeURIComponent(currentRoom)}&last_time=${lastTime}`);
                const messages = await res.json();
                if (!Array.isArray(messages)) return;

                for (let data of messages) {
                    lastTime = Math.max(lastTime, data.timestamp || 0);

                    if (data.user === currentUser) continue;

                    // Anti-replay: skip any authenticated (user|ts) we've already shown.
                    const tag = `${data.user}|${data.ts}`;
                    if (seen.has(tag)) continue;

                    const plaintext = await decryptMessage(data.ciphertext, data.iv, data.user, data.ts);

                    if (plaintext === null) {
                        // Could be a wrong key, or a forged sender / tampered message.
                        appendMessage(data.user, "🔒 [Unverified — wrong key or tampered message]", 'msg-other msg-error');
                    } else {
                        seen.add(tag);
                        appendMessage(data.user, plaintext, 'msg-other');
                    }
                }
            } catch (e) {
                // Ignore transient network errors.
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            if (enc.encode(text).length > 8000) return alert("Message too long.");
            input.value = '';
            appendMessage(currentUser, text, 'msg-self');

            const ts = Date.now(); // authenticated timestamp, bound into the cipher
            const { iv, ciphertext } = await encryptMessage(text, currentUser, ts);
            const payload = { user: currentUser, iv, ciphertext, ts };

            try {
                const res = await fetch(`${API}?room=${encodeURIComponent(currentRoom)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) appendSystemMessage("Server rejected the message.", true);
            } catch (e) {
                appendSystemMessage("Failed to send message to server.", true);
            }
        }

        // --- Helper Functions (innerText only — no HTML injection) ---
        function appendMessage(user, text, className) {
            const box = document.getElementById('chat-messages');
            const el = document.createElement('div');
            el.className = `message ${className}`;

            const senderEl = document.createElement('div');
            senderEl.className = 'msg-sender';
            senderEl.innerText = user;

            const textEl = document.createElement('div');
            textEl.innerText = text;

            if (className.indexOf('msg-self') === -1) el.appendChild(senderEl);
            el.appendChild(textEl);
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        }

        function appendSystemMessage(text, isError = false) {
            const box = document.getElementById('chat-messages');
            const el = document.createElement('div');
            el.style.alignSelf = 'center';
            el.style.fontSize = '0.85rem';
            el.style.color = isError ? 'var(--danger)' : '#888';
            el.innerText = text;
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
